<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cortana-scope</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --border: #334155;
    --text: #e2e8f0; --muted: #94a3b8;
    --accent: #a78bfa; --green: #4ade80; --blue: #60a5fa; --yellow: #facc15;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 2rem; }
  h1 { font-size: 1.8rem; color: var(--accent); margin-bottom: .25rem; }
  .updated { color: var(--muted); font-size: .85rem; margin-bottom: 2rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2.5rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
  .card .label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .card .value { font-size: 2rem; font-weight: 700; margin-top: .25rem; }
  .card .sub { font-size: .8rem; color: var(--muted); margin-top: .2rem; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .chart-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
  .chart-box h2 { font-size: 1rem; color: var(--accent); margin-bottom: 1rem; }
  .chart-box.full { grid-column: 1 / -1; }
  canvas { max-height: 280px; }
  @media (max-width: 700px) { .charts { grid-template-columns: 1fr; } .chart-box.full { grid-column: 1; } }
</style>
</head>
<body>
<h1>cortana-scope</h1>
<p class="updated">最終更新: 2026-08-19 00:29 JST</p>

<div class="cards">
  <div class="card">
    <div class="label">トークン節約</div>
    <div class="value" style="color:var(--green)">89.8M</div>
    <div class="sub">累計節約トークン数</div>
  </div>
  <div class="card">
    <div class="label">平均節約率</div>
    <div class="value" style="color:var(--accent)">97.9%</div>
    <div class="sub">RTK フィルタリング</div>
  </div>
  <div class="card">
    <div class="label">総コマンド数</div>
    <div class="value" style="color:var(--blue)">7,200</div>
    <div class="sub">累計実行回数</div>
  </div>
  <div class="card">
    <div class="label">プロジェクト数</div>
    <div class="value" style="color:var(--yellow)">17</div>
    <div class="sub">💡1 🔨3 ✅13</div>
  </div>
</div>

<div class="charts">
  <div class="chart-box full">
    <h2>トークン節約タイムライン</h2>
    <canvas id="tokenChart"></canvas>
  </div>
  <div class="chart-box">
    <h2>日次コマンド数</h2>
    <canvas id="cmdChart"></canvas>
  </div>
  <div class="chart-box">
    <h2>プロジェクトライフサイクル</h2>
    <canvas id="gantChart"></canvas>
  </div>
</div>

<script>
const dates = ["2026-06-25", "2026-06-26", "2026-06-27", "2026-06-28", "2026-06-29", "2026-06-30", "2026-07-01", "2026-07-02", "2026-07-03", "2026-07-04", "2026-07-05", "2026-07-06", "2026-07-07", "2026-07-08", "2026-07-09", "2026-07-10", "2026-07-11", "2026-07-12", "2026-07-13", "2026-07-14", "2026-07-15", "2026-07-16", "2026-07-17", "2026-07-18", "2026-07-19", "2026-07-21", "2026-07-22", "2026-07-23", "2026-07-27", "2026-08-03", "2026-08-05", "2026-08-13", "2026-08-14", "2026-08-15", "2026-08-17", "2026-08-18"];
const saved = [286683, 6668, 9261, 1011083, 470762, 106690, 4131777, 7765, 171601, 108316, 1157219, 30895, 188258, 41814, 124859, 9652, 78430720, 85319, 53254, 5058, 49255, 1205919, 128293, 1368009, 95873, 356015, 28574, 20218, 83, 1827, 1927, 48184, 28, 11850, 58, 0];
const inputTok = [399224, 8888, 11309, 1036493, 523195, 134995, 4139347, 27384, 294781, 210871, 1164178, 100848, 229575, 94075, 216295, 22636, 78508303, 160657, 91143, 21207, 112889, 1531712, 440622, 1419958, 180058, 399293, 54281, 36895, 91, 3567, 1965, 91118, 39, 17455, 349, 141];
const savingsPct = [71.8, 75.0, 81.9, 97.5, 90.0, 79.0, 99.8, 28.4, 58.2, 51.4, 99.4, 30.6, 82.0, 44.4, 57.7, 42.6, 99.9, 53.1, 58.4, 23.9, 43.6, 78.7, 29.1, 96.3, 53.2, 89.2, 52.6, 54.8, 91.2, 51.2, 98.1, 52.9, 71.8, 67.9, 16.6, 0.0];
const commands = [166, 25, 21, 137, 231, 88, 56, 89, 263, 651, 21, 361, 129, 197, 835, 124, 301, 292, 173, 52, 189, 833, 542, 254, 360, 182, 118, 147, 1, 8, 4, 304, 1, 42, 2, 1];
const pjLabels = ["voice-deck", "agent-lens (AX Inspector)", "last30days-studio", "design-md-spec", "cortana-design-system (CDS)", "memory-canvas", "html-video-studio", "mjml-studio", "mjml-studio-v2", "iptv-library", "3Dviewer", "music-assistant", "cortana-intro", "voice-studio", "ai-explorer", "atali_data", "Cortana 組織設計"];
const pjDates = ["2026-07-21", "2026-07-20", "2026-07-17", "2026-07-09", "2026-07-09", "2026-07-08", "2026-06-30", "2026-06-29", "2026-06-29", "2026-06-26", "2026-06-24", "2026-06-24", "2026-06-21", "2026-06-21", "2026-06-21", "2026-06-17", "2026-06-17"];
const pjColors = ["#60a5fa", "#facc15", "#60a5fa", "#4ade80", "#60a5fa", "#4ade80", "#4ade80", "#4ade80", "#4ade80", "#4ade80", "#4ade80", "#4ade80", "#4ade80", "#4ade80", "#4ade80", "#4ade80", "#4ade80"];
const pjBgs = ["rgba(96,165,250,0.15)", "rgba(250,204,21,0.15)", "rgba(96,165,250,0.15)", "rgba(74,222,128,0.15)", "rgba(96,165,250,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)", "rgba(74,222,128,0.15)"];
const pjStages = ["🔨 作成中", "💡 アイデア", "🔨 作成中", "✅ 完了", "🔨 作成中", "✅ 完了", "✅ 完了", "✅ 完了", "✅ 完了", "✅ 完了", "✅ 完了", "✅ 完了", "✅ 完了", "✅ 完了", "✅ 完了", "✅ 完了", "✅ 完了"];

Chart.defaults.color = '#94a3b8';
Chart.defaults.borderColor = '#334155';

// Token timeline
new Chart(document.getElementById('tokenChart'), {
  type: 'bar',
  data: {
    labels: dates,
    datasets: [
      {
        label: '節約トークン',
        data: saved,
        backgroundColor: 'rgba(74,222,128,0.5)',
        borderColor: '#4ade80',
        borderWidth: 1,
        yAxisID: 'y',
        order: 2,
      },
      {
        label: '節約率 %',
        data: savingsPct,
        type: 'line',
        borderColor: '#a78bfa',
        backgroundColor: 'transparent',
        pointRadius: 2,
        tension: 0.3,
        yAxisID: 'y1',
        order: 1,
      }
    ]
  },
  options: {
    responsive: true,
    interaction: { mode: 'index', intersect: false },
    scales: {
      y: { position: 'left', title: { display: true, text: '節約トークン数' } },
      y1: { position: 'right', min: 0, max: 100, title: { display: true, text: '節約率 %' }, grid: { drawOnChartArea: false } },
      x: { ticks: { maxTicksLimit: 10 } }
    }
  }
});

// Command chart
new Chart(document.getElementById('cmdChart'), {
  type: 'bar',
  data: {
    labels: dates,
    datasets: [{ label: 'コマンド数', data: commands, backgroundColor: 'rgba(96,165,250,0.5)', borderColor: '#60a5fa', borderWidth: 1 }]
  },
  options: { responsive: true, scales: { x: { ticks: { maxTicksLimit: 8 } } } }
});

// Project gantt (horizontal bar as doughnut alternative)
new Chart(document.getElementById('gantChart'), {
  type: 'bar',
  data: {
    labels: pjLabels,
    datasets: [{
      label: 'プロジェクト',
      data: pjLabels.map(() => 1),
      backgroundColor: pjBgs,
      borderColor: pjColors,
      borderWidth: 2,
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: (ctx) => pjStages[ctx.dataIndex] + '  ' + (pjDates[ctx.dataIndex] || ''),
        }
      }
    },
    scales: {
      x: { display: false },
      y: { ticks: { font: { size: 11 } } }
    }
  }
});
</script>
</body>
</html>
